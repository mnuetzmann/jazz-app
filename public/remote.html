<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jazz Remote</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Remote</h1>
    <p id="status">Waiting for the player…</p>
    <p id="now"></p>
    <div id="choices"></div>
    <form id="say" style="display:flex;gap:8px;margin:16px 0">
      <input id="text" placeholder="Type or dictate a style…" autocomplete="off"
        style="flex:1;font:inherit;font-size:1.1rem;padding:12px 16px;border-radius:999px;border:1px solid #8a6a3c;background:#2a1f15;color:#f1e4cf">
      <button>Send</button>
    </form>
    <div class="controls">
      <button id="pause">Pause</button>
      <button id="skip">Skip</button>
      <button id="change">Change style</button>
    </div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id);
    const send = (m) => fetch('/api/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(m) });
    $('say').onsubmit = (e) => { e.preventDefault(); const v = $('text').value.trim(); if (v) { send({ type: 'say', text: v }); $('text').value = ''; } };
    $('pause').onclick = () => send({ type: 'pause' });
    $('skip').onclick = () => send({ type: 'skip' });
    $('change').onclick = () => send({ type: 'change' });
    const events = new EventSource('/events');
    events.onopen = () => send({ type: 'hello' });
    events.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type !== 'state') return;
      $('status').textContent = m.phase === 'asking' ? 'What would you like to hear next?' : (m.phase === 'playing' ? 'Now playing' : 'Ready');
      $('now').textContent = m.track || '';
      const box = $('choices');
      box.innerHTML = '';
      for (const c of m.categories) {
        const b = document.createElement('button');
        b.textContent = c.label;
        b.onclick = () => send({ type: 'choose', category: c.id });
        box.appendChild(b);
      }
    };
  </script>
</body>
</html>
