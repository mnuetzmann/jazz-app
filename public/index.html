<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Soft Jazz Radio</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>Soft Jazz Radio</h1>
    <p id="status">Press start to begin.</p>
    <p id="now"></p>
    <p id="set"></p>
    <p id="heard"></p>
    <div id="choices"></div>
    <div class="controls">
      <button id="speak" hidden>🎤 Speak</button>
      <button id="start" class="big">Start</button>
      <button id="pause" hidden>Pause</button>
      <button id="skip" hidden>Skip</button>
      <button id="change" hidden>Change style</button>
    </div>
    <p class="hint">Casting? Cast this tab from Chrome (⋮ → Cast, Save and Share → Cast…). Choose "Cast tab" and enable audio.</p>
  </main>
  <script src="/player.js"></script>
</body>
</html>
